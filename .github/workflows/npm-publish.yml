name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.POLYROUTER_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.POLYROUTER_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POLYROUTER_POSTHOG_HOST || 'https://us.i.posthog.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install root dependencies
        run: npm install
        working-directory: .

      - name: Install CLI dependencies
        run: npm install
        working-directory: cli

      - name: Verify browser analytics configuration
        run: |
          test -n "$NEXT_PUBLIC_GA_MEASUREMENT_ID"
          test -n "$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"
          echo "GA4 and PostHog browser analytics are configured for this release."

      - name: Publish to npm
        run: npm publish --access public
        working-directory: cli
