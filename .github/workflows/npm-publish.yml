name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.POLYROUTER_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.POLYROUTER_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POLYROUTER_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      PUBLIC_INSTALLATION_TELEMETRY_URL: ${{ vars.POLYROUTER_PUBLIC_INSTALLATION_TELEMETRY_URL }}
      # Read-only display data (cloud sponsors, embedding banners), inlined by next.config.mjs.
      # Deliberately not in the verify step below: a missing banner must never fail a release.
      SPONSORS_SUPABASE_URL: ${{ vars.POLYROUTER_SPONSORS_SUPABASE_URL }}
      SPONSORS_SUPABASE_ANON_KEY: ${{ secrets.POLYROUTER_SPONSORS_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install root dependencies
        run: npm install
        working-directory: .

      - name: Install CLI dependencies
        run: npm install
        working-directory: cli

      - name: Verify browser analytics configuration
        run: |
          test -n "$NEXT_PUBLIC_GA_MEASUREMENT_ID"
          test -n "$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"
          test -n "$PUBLIC_INSTALLATION_TELEMETRY_URL"
          echo "GA4, PostHog, and public installation telemetry are configured for this release."

      - name: Check if package version already published
        id: check
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          latest=$(npm view "$pkg" version --registry https://registry.npmjs.org/ 2>/dev/null || echo "")
          echo "pkg=$pkg, local version=$ver, remote latest=$latest"
          if [ "$latest" = "$ver" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
        working-directory: cli

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
        working-directory: cli